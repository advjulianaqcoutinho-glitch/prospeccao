version: '3.8'

services:
  api:
    build: .
    image: prospector-api:latest
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - JWT_SECRET=${JWT_SECRET}
      - META_PIXEL_ID=${META_PIXEL_ID}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - PORT=3000
    networks:
      - prospector-net
      - igorpacheconet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=1"
        # Rota /api/*
        - "traefik.http.routers.prospector-api.entrypoints=websecure"
        - "traefik.http.routers.prospector-api.rule=Host(`prospect.igorpachecoads.com.br`) && PathPrefix(`/api`)"
        - "traefik.http.routers.prospector-api.priority=3"
        - "traefik.http.routers.prospector-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.prospector-api.service=prospector-api"
        - "traefik.http.services.prospector-api.loadbalancer.server.port=3000"
        - "traefik.http.services.prospector-api.loadbalancer.passHostHeader=true"
        - "traefik.http.services.prospector-api.loadbalancer.responseForwarding.flushInterval=100ms"
        # Rota WebSocket /socket
        - "traefik.http.routers.prospector-ws.entrypoints=websecure"
        - "traefik.http.routers.prospector-ws.rule=Host(`prospect.igorpachecoads.com.br`) && PathPrefix(`/socket`)"
        - "traefik.http.routers.prospector-ws.priority=2"
        - "traefik.http.routers.prospector-ws.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.prospector-ws.service=prospector-api"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - prospector-net
      - igorpacheconet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=1"
        - "traefik.http.routers.prospector.entrypoints=websecure"
        - "traefik.http.routers.prospector.rule=Host(`prospect.igorpachecoads.com.br`)"
        - "traefik.http.routers.prospector.priority=1"
        - "traefik.http.routers.prospector.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.prospector.service=prospector"
        - "traefik.http.services.prospector.loadbalancer.server.port=80"
        - "traefik.http.services.prospector.loadbalancer.passHostHeader=true"

networks:
  prospector-net:
    driver: overlay
    attachable: true
  igorpacheconet:
    external: true
